name: Refresh and publish

on:
  schedule:
    - cron: "17 9 * * *"   # every day at 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Check the Artificial Analysis key is set
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          if [ -z "$AA_API_KEY" ]; then
            echo "::error::Repository secret AA_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Pull every source and rebuild the tables
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python scripts/refresh.py

      - name: Build the page
        run: python build.py

      - name: Sanity checks (a failure here publishes nothing)
        run: python scripts/check.py

      - name: Commit the data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/profile.json index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Data refresh $(date -u +%F)"
            git push
          fi

      - name: Collect the page
        run: mkdir -p _site && cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
